<h1>PersonalAgent</h1>
<p>PersonalAgent is a private, single-user tool that runs locally on its owner's computer.
It reads the owner's own Gmail, Google Calendar and Google Drive to sort mail, plan the day and find documents.</p>
<p>It is not offered to other users.</p>
